name: AI Code Review Agent

on:
  pull_request:
    types: [opened, synchronize] # Triggers when PR opens or gets new commits

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Allows AI to write comments on the PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run AI Code Reviewer
        uses: anc95/ChatGPT-Action@v1.4.0
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: "gpt-4o" # Uses a fast and smart model for JS evaluation
          output_lang: "en"
